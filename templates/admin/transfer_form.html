<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ 'Редактирование' if transfer else 'Новый трансфер' }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}" />
  </head>
  <body class="admin-standalone">
    <main class="admin-card-page">
      <div class="admin-page-actions"><a class="admin-link-button" href="{{ url_for('admin_transfers') }}">← К трансферам</a></div>
      <article class="panel">
        <p class="eyebrow">Трансферы</p>
        <h1>{{ 'Редактировать трансфер' if transfer else 'Добавить трансфер' }}</h1>
        {% if error %}<p class="admin-alert error">{{ error }}</p>{% endif %}
        <form class="form-grid" method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
          <label>Игрок<input name="player" value="{{ request.form.get('player', transfer.player if transfer else '') }}" required /></label>
          <label>Из команды<input name="from_team" value="{{ request.form.get('from_team', transfer.from_team if transfer else '') }}" required /></label>
          <label>В команду<input name="to_team" value="{{ request.form.get('to_team', transfer.to_team if transfer else '') }}" required /></label>
          <label>Дата<input name="transfer_date" type="date" value="{{ request.form.get('transfer_date', transfer.transfer_date if transfer else '') }}" /></label>
          {% set selected_status = request.form.get('status', transfer.status if transfer else 'На рассмотрении') %}
          <label>Статус<select name="status">
            {% for status in ['На рассмотрении', 'Подтверждён', 'Отклонён'] %}
            <option value="{{ status }}" {% if selected_status == status %}selected{% endif %}>{{ status }}</option>
            {% endfor %}
          </select></label>
          <button type="submit">Сохранить трансфер</button>
        </form>
      </article>
    </main>
    <script src="{{ url_for('static', filename='js/admin-date.js') }}"></script>
  </body>
</html>
